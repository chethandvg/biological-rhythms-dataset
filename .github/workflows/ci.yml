name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: chethandvg/.github/.github/workflows/rust-ci.yml@v1
  python:
    uses: chethandvg/.github/.github/workflows/py-bindings-ci.yml@v1
  wasm:
    uses: chethandvg/.github/.github/workflows/wasm-ci.yml@v1
  dataset:
    name: dataset (generated files are current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml jsonschema
      - name: data/rhythms.yaml is valid; JSON, CSV, R claims and README tables match it
        run: python scripts/build.py --check
