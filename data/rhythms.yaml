    value: 1.31
    stage: "Natural menstrual cycle, menstrual phase"
  - <<: *rees2023
    id: bio:HUMAN-UTERINE-CONTRACTIONS-LATE-LUTEAL
    quantity: "Human uterine contraction frequency in the late luteal phase"
    value: 1.35
    stage: "Natural menstrual cycle, late luteal phase"

