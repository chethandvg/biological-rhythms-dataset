# Claims ledger for biological-rhythms-dataset (schema evidence-kernel/claims@1, https://github.com/chethandvg/evidence-kernel).
# Levels: P proved in Lean · V verified numerics · T tested · R referenced (DOI/PMID) · M model assumption.
# The R claims at the end are generated from data/rhythms.yaml by scripts/build.py; edit that file, not them.
schema: evidence-kernel/claims@1
repo: biological-rhythms-dataset
prefix: bio
claims:
  - id: bio:INTERPOLATION-AT-MEASUREMENTS
    version: 1.0.0
    level: P
    statement: "Linear interpolation between two measurements taken at different times returns each measurement exactly at its own time."
    proof: proofs/BiologicalRhythmsDataset/Interpolation.lean#BiologicalRhythmsDataset.lerp_at_ends
  - id: bio:INTERPOLATION-BOUNDED
    version: 1.0.0
    level: P
    statement: "Between two measurements, linear interpolation never leaves the range they span: it is at least the smaller measured value and at most the larger."
    proof: proofs/BiologicalRhythmsDataset/Interpolation.lean#BiologicalRhythmsDataset.lerp_between
  - id: bio:HEART-RATE-WEEK-PLACEMENT
    version: 1.0.0
    level: M
    statement: "heart_rate_at places the Ouyang et al. 2020 median for gestational week w at w + 0.5 weeks, the middle of that week."
    assumption: "Each weekly median summarises the pregnancies scanned during completed week w, the usual way of reporting gestational age, and the middle of the week represents them. The 0.5 treats gestational age as continuous within the week, from w to w+1; if age is counted in whole days, w+0 to w+6, the middle is w + 3/7 (about w + 0.43) weeks, half a day earlier, which would move heart_rate_at by at most about 2 bpm (its steepest segment rises 29 bpm a week). The full text (PMC7488996, Methods) obtains GW by dividing the gestational day by 7 and computes the percentiles 'for each time point', but states no rule (rounding or truncation) for assigning scans to whole weeks; the abstract gives the same fit in days and in weeks. The paper's own fit, HR = -350.410 + 107.788 GW - 5.488 GW^2, agrees with every weekly median to within 5 bpm at w + 0.5 (118, 149, 169, 178 and 176 bpm at 6.5 to 10.5 weeks, against medians of 117, 146, 174, 176 and 174); at w + 3/7 its largest miss is 5.8 bpm (168 against 174 at 8 weeks), and at the whole week it is 18 bpm (99 bpm at 6.0 weeks, against 117). Placing the medians at the whole week would shift the curve half a week early."
    value: {value: 0.5, unit: "weeks"}
    species: "Homo sapiens"
    method: "Each binned median placed at the middle of its bin, checked against the regression of heart rate on gestational week in the paper's abstract"
    sources:
      - {cite: "Ouyang et al. 2020, BMC Pregnancy and Childbirth 20:533", doi: "10.1186/s12884-020-03186-2", pmid: "32928137"}
    notes: "The 0.5 is the offset of the human-heart-rate series in data/rhythms.yaml. If the authors confirm that the weeks were grouped differently (whole days would give 3/7), change the offset there and bump the major version of this claim and of bio:HEART-RATE-AT."
    tags: ["heart"]
  - id: bio:HEART-RATE-AT
    version: 1.0.0
    level: T
    statement: "heart_rate_at(w) returns each Ouyang et al. 2020 weekly median exactly at the middle of its week (6.5, 7.5, 8.5, 9.5 and 10.5 weeks; bio:HEART-RATE-WEEK-PLACEMENT), interpolates linearly between neighbouring medians to within 1e-15 relative of an exact rational oracle, stays between the two bracketing medians in floating point too, and rejects weeks outside [6.5, 10.5]."
    depends_on: ["bio:HEART-RATE-WEEK-PLACEMENT@1", "bio:INTERPOLATION-AT-MEASUREMENTS@1", "bio:INTERPOLATION-BOUNDED@1", "bio:HUMAN-EHR-6W@1", "bio:HUMAN-EHR-7W@1", "bio:HUMAN-EHR-8W@1", "bio:HUMAN-EHR-9W@1", "bio:HUMAN-EHR-10W@1"]
    tests: [vectors/heart_rate.json, src/lib.rs]
  - id: bio:CELL-COUNT-AT
    version: 1.0.0
    level: T
    statement: "cell_count_at(h) is 1 before t2 and k from the mean time tk until the next division (k = 2 to 8), using the Lorenzo Rodríguez et al. 2026 means, and rejects hours below 0 or after t8, where the dataset has no division times."
    depends_on: ["bio:HUMAN-EMBRYO-T2@1", "bio:HUMAN-EMBRYO-T3@1", "bio:HUMAN-EMBRYO-T4@1", "bio:HUMAN-EMBRYO-T5@1", "bio:HUMAN-EMBRYO-T6@1", "bio:HUMAN-EMBRYO-T7@1", "bio:HUMAN-EMBRYO-T8@1"]
    tests: [vectors/cell_count.json, src/lib.rs]
  - id: bio:FREQUENCY-HZ
    version: 1.0.0
    level: T
    statement: "frequency_hz(id) converts every period, frequency and rate in the dataset to its range in hertz with rhythm-units (f = 1/T for a period, bpm/60 for a rate), matching an exact rational oracle to within 1e-15 relative, and rejects durations, time points, stages and counts."
    depends_on: ["rhythm:FREQ-PERIOD-INVERSE@1", "rhythm:MINUTES-AS-SECONDS@1", "rhythm:BPM-HZ-INVERSE@1"]
    tests: [vectors/frequency.json, src/lib.rs]
  - id: bio:DATASET-CONSISTENT
    version: 1.0.0
    level: T
    statement: "data/rhythms.yaml matches its JSON Schema; every entry is one species, named in its id and its description, with a method and at least one source that has a DOI or PMID; and data/rhythms.json, data/rhythms.csv, the R claims in this ledger and the README tables are exactly what scripts/build.py generates from it, which CI checks on every push."
    tests: [scripts/build.py, schema/rhythms.schema.json, schema/sources.schema.json, .github/workflows/ci.yml]
  - id: bio:IMPLEMENTATIONS-AGREE
    version: 1.0.0
    level: T
    statement: "The Rust crate, the Python bindings and the WebAssembly bindings return the same records, unchanged from data/rhythms.json, and the same helper results on every shared golden vector."
    tests:
      - vectors/records.json
      - vectors/frequency.json
      - vectors/heart_rate.json
      - vectors/cell_count.json
      - tests/vectors.rs
      - bindings/python/tests/test_vectors.py
      - bindings/wasm/tests/vectors.test.mjs
