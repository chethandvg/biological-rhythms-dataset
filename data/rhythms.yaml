  # Segmentation clock
  - <<: *segmentation
    id: bio:HUMAN-SEGMENTATION-CLOCK-PERIOD
    quantity: "Period of the human segmentation clock in presomitic mesoderm cells derived in vitro"
    species: Homo sapiens
    value: 5
    statistic: approximate
    stage: "Presomitic mesoderm induced in vitro from human pluripotent stem cells"
    sources: [matsuda2020nature, diazcuadros2020, matsuda2020science, diazcuadros2026]
    notes: "Measured only in vitro: the human clock has not been recorded in an embryo. Matsuda et al. 2020 (Science) give 5-6 h."
    contested: "Diaz-Cuadros et al. 2020 carries an Editor's Note (February 2024) about cell-tracking errors; its Author Correction (Nature 654:E13, 2026) states that the conclusions still hold."
  - <<: *segmentation
    id: bio:MOUSE-SEGMENTATION-CLOCK-PERIOD
    quantity: "Period of the mouse segmentation clock in presomitic mesoderm cells derived in vitro"
    species: Mus musculus
    min: 2
    max: 3
    statistic: range
    stage: "Presomitic mesoderm induced in vitro from mouse pluripotent stem cells"
    sources: [matsuda2020science, diazcuadros2020, diazcuadros2026]
    notes: "The 2-3 h range is from Matsuda et al. 2020 (Science). Diaz-Cuadros et al. 2020 measured 2.5 h in mouse cells, half the human period in the same study; that paper carries the same Editor's Note (February 2024) and Author Correction (Nature 654:E13, 2026) as bio:HUMAN-SEGMENTATION-CLOCK-PERIOD, and the correction states that its conclusions still hold."

  # Zygotic (embryonic) genome activation
  - <<: *zga
    id: bio:HUMAN-MAJOR-ZGA-STAGE
    quantity: "Cell stage of major embryonic genome activation in human embryos"
    species: Homo sapiens
    min: 4
    max: 8
    statistic: range
    stage: "Preimplantation embryo, between the 4- and 8-cell stages"
    method: "Patterns of newly synthesised polypeptides in IVF embryos and their dependence on transcription"
    sources: [braude1988, asami2022]
    notes: "Cleavage is not sensitive to transcriptional inhibition until after the 4-cell stage."
    contested: "Revised in part: low-level transcription begins earlier, at the one-cell stage (Asami et al. 2022; bio:HUMAN-MINOR-ZGA-STAGE). The major wave is still placed at 4-8 cells."
  - <<: *zga
    id: bio:HUMAN-MINOR-ZGA-STAGE
    quantity: "Cell stage at which human embryonic transcription begins (minor genome activation)"
    species: Homo sapiens
    value: 1
    statistic: observed
    stage: "Bipronuclear one-cell embryo (zygote)"
    method: "High-resolution single-cell RNA sequencing of MII oocytes and bipronuclear one-cell embryos"
    sources: [asami2022]
    notes: "Low-magnitude upregulation of hundreds of spliced transcripts."
  - <<: *zga
    id: bio:MOUSE-MAJOR-ZGA-STAGE
    quantity: "Cell stage of major zygotic genome activation in mouse embryos"
    species: Mus musculus
    value: 2
    statistic: reported
    stage: "Mid-to-late 2-cell embryo, after the second round of DNA replication"
    method: "Review of transcriptome and transcription-inhibition studies of mouse embryos"
    sources: [aoki2022, braude1988]
  - <<: *zga
    id: bio:MOUSE-MINOR-ZGA-STAGE
    quantity: "Cell stage of minor zygotic genome activation in mouse embryos"
    species: Mus musculus
    value: 1
    statistic: reported
    stage: "Mid one-cell embryo (zygote)"
    method: "Review of transcriptome and transcription-inhibition studies of mouse embryos"
    sources: [aoki2022]
