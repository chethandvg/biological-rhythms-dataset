[package]
name = "biological-rhythms-dataset-py"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
name = "biological_rhythms_dataset"
crate-type = ["cdylib"]

[dependencies]
biological_rhythms_dataset_rs = { package = "biological-rhythms-dataset", path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

# A separate workspace, so the core crate's `cargo test` never links Python.
[workspace]
