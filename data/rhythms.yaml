# Biological rhythms dataset: the one hand-edited file of measurements (licence CC BY-NC 4.0).
#
# Each entry is one measurement in one species, and becomes one R claim in claims.yaml; its id is
# the claim id and never changes. Source keys point to data/sources.yaml. After editing, run
#
#     python scripts/build.py
#
# to regenerate data/rhythms.json, data/rhythms.csv, the R claims in claims.yaml and the README
# measurement tables. It then runs `ek readme-table claims.yaml README.md --write` to refresh the
# README claims table as well, when the ek CLI (evidence-kernel) is installed; otherwise run that
# command yourself. CI runs `python scripts/build.py --check` and `ek readme-table --check`.
# Schema: schema/rhythms.schema.json.
#
# Fields shared by several entries are written once under `shared` and merged into each entry with
# a YAML merge key (`<<: *name`); a field written in the entry itself wins.

schema: biological-rhythms-dataset/rhythms@1

series:
  human-heart-rate:
    description: "Median embryonic heart rate by gestational week (Ouyang et al. 2020). heart_rate_at() places the median of week w at w + offset, the middle of the completed week it is taken to cover (the model assumption bio:HEART-RATE-WEEK-PLACEMENT), and interpolates linearly between neighbouring medians."
    at: gestational week, as the paper labels it
    offset: 0.5
  human-cleavage:
    description: "Mean time from insemination until the embryo reaches each number of cells from 2 to 8 (Lorenzo Rodríguez et al. 2026). cell_count_at() is the step function over these times."
    at: number of cells

shared:
  taylor1993: &taylor1993
    topic: egg-activation
    species: Homo sapiens
    stage: "Oocyte donated during IVF treatment, inseminated in vitro"
    method: "Aequorin Ca2+ measurement with a photomultiplier in eggs donated during IVF treatment, zona-intact and zona-free, inseminated under perfusion"
    n: 10
    n_unit: "eggs with Ca2+ transients, of 26 inseminated"
    sources: [taylor1993]
  kline1992: &kline1992
    topic: egg-activation
    species: Mus musculus
    statistic: mean
    stage: "Zona-free egg, fertilised in vitro"
    method: "Fluo-3 Ca2+ imaging of zona-free eggs during in vitro fertilisation"
    sources: [kline1992]
  que2015: &que2015
    topic: egg-activation
    species: Mus musculus
    kind: count
    stage: "Mature (MII) egg"
    method: "Live zinc-probe imaging, scanning transmission electron microscopy with energy-dispersive spectroscopy, and X-ray fluorescence microscopy and tomography"
    sources: [que2015]
  gallagher2019: &gallagher2019
    topic: sperm
    species: Homo sapiens
    kind: frequency
    unit: Hz
    statistic: median
    method: "High-speed imaging at 169.2 frames/s with automated flagellar tracking (FAST) of free-swimming progressive cells; three donors in total"
    n_unit: "cells"
    sources: [gallagher2019]
  ooi2014: &ooi2014
    topic: sperm
    species: Homo sapiens
    kind: frequency
    unit: Hz
    statistic: median
    method: "High-speed imaging at 332 frames/s of head-adhered cells at 21 °C, the same cells before and after 4-aminopyridine (4-AP)"
    n: 34
    n_unit: "cells from 4 donors"
    sources: [ooi2014]
  rees2023: &rees2023
    topic: uterus
    species: Homo sapiens
    kind: rate
    unit: /min
    statistic: reported
    method: "Four-minute transvaginal ultrasound recordings analysed by speckle tracking; contraction frequency of the posterior uterine wall"
    n: 70
    n_unit: "recordings analysed across all phases together, of 96 from 64 healthy women with natural cycles; the number in each phase is not recorded here"
    sources: [rees2023]
  lorenzo2026: &lorenzo2026
    topic: preimplantation
    species: Homo sapiens
    kind: time
    unit: h
    statistic: mean
    method: "Time-lapse imaging of embryos from oocyte-donation cycles fertilised with fresh ejaculated partner sperm (mostly ICSI); single-centre retrospective cohort of 469 cycles, 2013-2020"
    n: 2523
    n_unit: "correctly fertilised oocytes in the fresh-sperm group (the group size, not the number of embryos timed at each stage, which is not recorded here)"
    notes: "Hours after insemination; fresh-sperm group, Table 5 of the paper."
    sources: [lorenzo2026]
  lorenzo2026-cleavage: &lorenzo2026-cleavage
    <<: *lorenzo2026
    series: human-cleavage
  ouyang2020: &ouyang2020
    topic: heart
    species: Homo sapiens
    kind: rate
    unit: bpm
    statistic: median
    method: "Early ultrasound measurements in singleton IVF-ET pregnancies with phenotypically normal live births after 37 weeks, 2010-2016; 5th, 50th and 95th percentiles by gestational week"
    n_unit: "pregnancies measured in this gestational week (Table 3 of the paper; 30,416 across weeks 6-10)"
    series: human-heart-rate
    sources: [ouyang2020]
  segmentation: &segmentation
    topic: segmentation
    kind: period
    unit: h
    method: "Time-lapse imaging of oscillating segmentation-clock gene expression (such as HES7) in presomitic mesoderm induced in vitro from pluripotent stem cells"
  zga: &zga
    topic: genome-activation
    kind: stage
    unit: cells

rhythms:
  # Egg activation: Ca2+ spikes and zinc sparks
  - <<: *taylor1993
    id: bio:HUMAN-CA-SPIKE-INTERVAL
    quantity: "Interval between Ca2+ spikes in human eggs at fertilisation"
    kind: period
    min: 10
    max: 35
    unit: min
    statistic: range
    notes: "Amplitude (up to 2.5 µM), duration and interval were similar in zona-intact and zona-free eggs. Only 10 of 26 inseminated eggs responded."
  - <<: *taylor1993
    id: bio:HUMAN-CA-SPIKE-DURATION
    quantity: "Duration of each Ca2+ spike in human eggs at fertilisation"
    kind: duration
    value: 120
    unit: s
    statistic: approximate
    notes: "Amplitude up to 2.5 µM, measured with aequorin."
  - <<: *kline1992
    id: bio:MOUSE-CA-SPIKE-INTERVAL
    quantity: "Interval between Ca2+ transients in mouse eggs at fertilisation"
    kind: period
    value: 3.4
    unit: min
    notes: "Reported as 3.4 ± 1.4 min. Mouse intervals depend on the conditions; compare bio:MOUSE-ZINC-SPARK-INTERVAL."
  - <<: *kline1992
    id: bio:MOUSE-CA-FIRST-TRANSIENT-DURATION
    quantity: "Duration of the first Ca2+ transient in mouse eggs at fertilisation"
    kind: duration
    value: 2.3
    unit: min
    notes: "Reported as 2.3 ± 0.6 min; the first transient lasts longer than the ones that follow."
  - <<: *kline1992
    id: bio:MOUSE-CA-SPIKE-DURATION
    quantity: "Duration of each later Ca2+ transient in mouse eggs at fertilisation"
    kind: duration
    value: 0.5
    unit: min
    notes: "Reported as 0.5 ± 0.1 min."
  - id: bio:MOUSE-ZINC-SPARK-INTERVAL
    topic: egg-activation
    quantity: "Interval between zinc sparks in activated mouse eggs"
    species: Mus musculus
    kind: period
    value: 9.5
    unit: min
    statistic: mean
    stage: "Mature (MII) egg, mostly activated parthenogenetically with SrCl2"
    method: "Imaging of zinc released into the medium with an extracellular zinc dye, alongside intracellular Ca2+ imaging"
    n: 36
    n_unit: "intervals between sparks"
    sources: [kim2011]
    notes: "Mean ± SEM 9.5 ± 0.8 min, range 3.46-26.00 min. Each spark followed a Ca2+ transient; eggs gave 1-5 sparks, all within about the first 90 min. Most eggs were activated with strontium, not sperm."
  - <<: *que2015
    id: bio:MOUSE-EGG-ZINC-VESICLES
    quantity: "Number of zinc-loaded cortical vesicles in a mouse egg"
    value: 8000
    unit: vesicles
    statistic: estimate
    notes: "An extrapolated estimate. More than 90% of the vesicles lie within 5 µm of the plasma membrane."
  - <<: *que2015
    id: bio:MOUSE-ZINC-VESICLE-ATOMS
    quantity: "Zinc atoms in one cortical vesicle of a mouse egg"
    value: 1000000
    unit: atoms
    statistic: approximate
    notes: "About 10^6 atoms per vesicle on average, so the vesicles together hold about 8 × 10^9 atoms, roughly 15% of the egg's zinc."
  - id: bio:HUMAN-ZINC-SPARKS-PER-EGG
    topic: egg-activation
    quantity: "Number of zinc sparks in a human egg activated with PLCζ"
    species: Homo sapiens
    kind: count
    value: 1
    unit: sparks
    statistic: observed
    stage: "Egg matured in vitro and activated without sperm, by injection of hPLCζ cRNA"
    method: "Fluo-4 Ca2+ imaging and extracellular FluoZin-3 zinc imaging of discarded immature eggs from ICSI cycles, mostly matured in vitro; other eggs in the study were activated with Ca-ionomycin or ionomycin"
    n: 2
    n_unit: "eggs that sparked, of 5 injected with hPLCζ cRNA"
    sources: [duncan2016, que2019]
    notes: "The spark is tightly coordinated with the first Ca2+ transient. These eggs were activated artificially; the human zinc spark has not been shown at fertilisation by sperm. Que et al. 2019, a bovine study, is cited only for its statement that the zinc spark has been documented in humans; the value of 1 spark is from Duncan et al. 2016."

  # Sperm flagellar beat
  - <<: *gallagher2019
    id: bio:HUMAN-SPERM-BEAT-DILUTED-SEMEN
    quantity: "Flagellar beat frequency of human sperm swimming in diluted semen"
    value: 19
    stage: "Progressive, free-swimming sperm in diluted semen (low viscosity)"
    n: 205
    notes: "IQR 6.5 Hz. The CASA 'beat-cross frequency' does not measure this: a straight-line fit between the two gave R² = 0.042."
  - <<: *gallagher2019
    id: bio:HUMAN-SPERM-BEAT-VISCOUS
    quantity: "Flagellar beat frequency of human sperm swimming in a high-viscosity medium"
    value: 10
    stage: "Progressive, free-swimming sperm in high-viscosity methylcellulose medium"
    n: 119
    notes: "IQR 2.9 Hz, about half the beat frequency in diluted semen (bio:HUMAN-SPERM-BEAT-DILUTED-SEMEN)."
  - <<: *ooi2014
    id: bio:HUMAN-SPERM-BEAT-ADHERED
    quantity: "Flagellar beat frequency of head-adhered human sperm before stimulation"
    value: 18.9
    stage: "Head-adhered sperm in low-viscosity medium, before stimulation"
    notes: "IQR 15.0-24.2 Hz. The same cells as bio:HUMAN-SPERM-BEAT-HYPERACTIVATED."
  - <<: *ooi2014
    id: bio:HUMAN-SPERM-BEAT-HYPERACTIVATED
    quantity: "Flagellar beat frequency of head-adhered human sperm hyperactivated with 4-AP"
    value: 11.7
    stage: "Head-adhered sperm after hyperactivation with 4-aminopyridine"
    notes: "IQR 9.9-14.6 Hz. Ooi et al. report a change of -36% from the same cells before stimulation (the two medians alone differ by 38%), while the RMS bending angle rose from 25.4° to 46.7°. 4-AP is a drug trigger, not physiological capacitation; 13 of the 34 cells beat with several frequency modes."

  # Oviduct cilia
  - id: bio:HUMAN-OVIDUCT-CILIA-BEAT
    topic: oviduct
    quantity: "Ciliary beat frequency in the human fallopian tube"
    species: Homo sapiens
    kind: frequency
    value: 5.3
    unit: Hz
    statistic: mean
    stage: "Fallopian tube epithelium ex vivo, proliferative and secretory phases"
    method: "Light-intensity variation recording of ciliary beating in tubes removed at hysterectomy for benign conditions"
    n: 26
    n_unit: "women (14 in the proliferative, 12 in the secretory phase)"
    sources: [lyons2002, bylander2010]
    notes: "Reported as 5.3 ± 0.2 Hz. No significant difference between anatomical sites; in the fimbria the beat was faster in the secretory phase (5.8 Hz) than in the proliferative phase (4.9 Hz)."
    contested: "Bylander et al. 2010, a mouse study, quote 5-20 Hz for the human tube, citing older human studies by Mahmood et al. (1998) and Westrom et al.; this direct measurement lies at the low end of that range."
  - id: bio:MOUSE-OVIDUCT-CILIA-BEAT
    topic: oviduct
    quantity: "Ciliary beat frequency in the mouse fallopian tube"
    species: Mus musculus
    kind: frequency
    value: 23.3
    unit: Hz
    statistic: mean
    stage: "Fallopian tube pieces ex vivo, before any hormone was added"
    method: "High-speed bright-field imaging at 35 °C of tube pieces held still by a motorised needle"
    n: 19
    n_unit: "mice"
    sources: [bylander2010]
    notes: "Reported as 23.3 ± 3.8 Hz (range 16.8-31.9 Hz). Progesterone at 100 nM lowered it by 15% compared with controls after 30 min."

  # Uterine contractions
  - <<: *rees2023
    id: bio:HUMAN-UTERINE-CONTRACTIONS-LATE-FOLLICULAR
