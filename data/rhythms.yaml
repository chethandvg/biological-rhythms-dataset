    id: bio:HUMAN-EHR-6W
    quantity: "Median human embryonic heart rate at 6 weeks of gestation"
    value: 117
    stage: "6 gestational weeks"
    at: 6
    n: 20272
    notes: "5th-95th percentile 103-128 bpm."
  - <<: *ouyang2020
    id: bio:HUMAN-EHR-7W
    quantity: "Median human embryonic heart rate at 7 weeks of gestation"
    value: 146
    stage: "7 gestational weeks"
    at: 7
    n: 2969
  - <<: *ouyang2020
    id: bio:HUMAN-EHR-8W
